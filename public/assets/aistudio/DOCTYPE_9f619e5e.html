        // --- 1. Security & Keys ---
        const AUTH_KEY = "1832.b1ede2fe899bdec88938";

        function printLog(msg, color="#a3e2e2") {
            const time = new Date().toTimeString().split(' ')[0];
            tLog.innerHTML += `<div><span style="color:#64748b">[${time}]</span> <span style="color:${color}">${msg}</span></div>`;

        }

        // --- 2. The Guardian Gate (Lock Screen) ---
        window.breachGateway = function() {
            const hash = document.getElementById('auth-hash').value;
            const tfa = document.getElementById('auth-2fa').value;
            const err = document.getElementById('gate-error');
            
            // Simulation of FNZ+ISO+BEAT Hash check
            if (hash.length > 5 && tfa.length === 6) {

                    document.getElementById('guardian-gate').style.display = 'none';
                    document.getElementById('infinite-canvas').classList.remove('hidden');
                    initiateSprocketing(); // Trigger backend auto-connect
                    generateQuineRegistry(); // Generate the Data URLs
                }, 1200);
            } else {
                err.style.opacity = 1;
                setTimeout(() => err.style.opacity = 0, 3000);
            }
        };

        // --- 3. Cryptographic Logo Decoding ---
        window.decodeLore = function() {
            const sigil = document.getElementById('cryptic-logo');
            const encoded = sigil.getAttribute('data-ideology');
            const decoded = atob(encoded);
            printLog("----------------------------------", "#a855f7");
            printLog("CRYPTIC LINGUISTIC PROCEDURAL LORE", "#a855f7");
            printLog("----------------------------------", "#a855f7");
            decoded.split('. ').forEach(step => {
                if(step) printLog(`> ${step}`, "#facc15");
            });
            printLog("----------------------------------", "#a855f7");
        };

        // --- 4. WebSocket Sprocketing ---
        let ws;
        function initiateSprocketing() {
            printLog(`Initiating sprocketing to ws://127.0.0.1:8080...`, "#00ffff");
            try {
                ws = new WebSocket('ws://127.0.0.1:8080');
                
                ws.onopen = () => {
                    printLog("Sprocket aligned. Transmitting AUTH_KEY and KNOCK_ID...", "#facc15");
                    ws.send(JSON.stringify({ type: 'auth', key: AUTH_KEY, knock: KNOCK_ID }));
                };

                ws.onmessage = (e) => {
                    const res = JSON.parse(e.data);
                    if (res.type === 'sys') {
                        if (res.data.includes("AUTH SUCCESS")) {
                            wsStatus.innerText = "ONLINE / SECURE";
                            wsStatus.className = "text-green-400 font-bold";
                            printLog("Sovereign Omni-Bridge Unlocked.", "#4ade80");
                            // Capture the returned Quine network link
                            if(res.link) {
                                registerDataUrl("Omni-Bridge Server (network.1)", res.link, "#a855f7");
                            }
                        }
                    } else if (res.type === 'err') {
                        printLog(res.data, "#f87171");
                    } else {
                        printLog(res.data);
                    }
                };

                ws.onerror = () => {
                    wsStatus.innerText = "OFFLINE";
                    wsStatus.className = "text-red-500 font-bold";
                    printLog("Connection failed. Omni-bridge script not running on target port.", "#f87171");
                };

            } catch(e) {
                printLog(`WS Error: ${e.message}`, "#f87171");
            }
        }

        tIn.addEventListener('keypress', (e) => {
            if(e.key === 'Enter') {
                const val = tIn.value.trim();
                if(!val) return;
                printLog(`> ${val}`, "#fff");
                if (ws && ws.readyState === 1) {
                    ws.send(JSON.stringify({ type: 'command', cmd: val }));
                } else {
                    printLog("Local execution: Awaiting backend recovery.", "#64748b");
                }
                tIn.value = '';
            }
        });

        // --- 5. The Living Quine & Data URL Generator ---
        function registerDataUrl(title, url, color="#00ffff") {
            const shortUrl = url.substring(0, 40) + '...#' + KNOCK_ID;
            const div = document.createElement('div');
            div.className = "p-2 bg-black/40 border border-slate-700 rounded hover:border-cyan-500 transition-colors cursor-pointer";

                <div class="text-[9px] text-slate-500 truncate mt-1">${shortUrl}</div>
            `;
            div.onclick = () => {
                printLog(`Loading ${title} into main viewport...`, color);
                viewport.src = url;
            };
            registryList.appendChild(div);
        }

        function generateQuineRegistry() {
            printLog("Executing Quine Registry Compilation...", "#facc15");

            // 1. Self-Reference (Hamiltonians CrypticNexus)
            const selfHtml = document.documentElement.outerHTML;

            registerDataUrl("Hamiltonians CrypticNexus (Self)", selfDataUrl, "#facc15");

            const mhtmlB64 = btoa(unescape(encodeURIComponent(mhtmlInfo)));

            registerDataUrl("MHTML Archive Link", mhtmlDataUrl, "#d946ef");
